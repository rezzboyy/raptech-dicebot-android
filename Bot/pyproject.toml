[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raptech-terminal-core"
version = "1.1.1"
description = "Raptech Terminal Core â€” multi-site crypto dice automation bot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Raptech" }]
dependencies = [
    "colorama>=0.4.6",
    "requests>=2.31.0",
    "websocket-client>=1.7",
    "python-socketio[client]>=5.10",
    "curl_cffi>=0.7.0",
    "lupa>=2.0",
    "orjson>=3.9.0",
    "httpx[http2]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
raptech-bot = "corebot.cli:main"

[tool.setuptools.packages.find]
include = ["corebot*"]
exclude = ["tests*", "scripts*", "release*", "reports*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # baris panjang dibatasi line-length, sisanya manual

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
